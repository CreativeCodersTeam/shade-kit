name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: -t nugetpush -t smoketest -t createdistpackages
          - os: windows-latest
            targets: -t pack -t smoketest -t createdistpackages
          - os: macos-latest
            targets: -t pack -t smoketest -t createdistpackages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Build with targets: ${{ matrix.targets }}'
        run: ./build.cmd ${{ matrix.targets }}
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_ORG_TOKEN }}
      - name: 'Publish: coverage_report'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ runner.os }}
          path: .tests/coverage-report
      - name: 'Publish: dist packages'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: |
            .artifacts/dist/*.tar.gz
            .artifacts/dist/*.zip
      - name: 'Publish: nuget package'
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: .artifacts/nuget/*.nupkg

  # The GitHub release is created only after every platform has built, tested and smoke-tested its binaries.
  github-release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Download: dist packages'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: .artifacts/dist
      - name: 'Download: nuget package'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: .artifacts/nuget
      - name: 'Create GitHub release'
        run: ./build.cmd -t creategithubrelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
